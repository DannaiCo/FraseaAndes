<!doctype html>
<html lang="es">
  <head>
    <title>Semanasanta</title>

    <!-- ✅ Fuente correcta -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&display=swap"
      rel="stylesheet" />

    <style>
      .stage {
        position: relative;
        width: 4147px;
        height: 1556px;
        transform-origin: top left;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: black;
      }

      .video-bg {
        position: absolute;
        top: 0;
        left: 0;
        width: 4147px;
        height: 1556px;
        object-fit: cover;
        z-index: 0;
      }

      .contador {
        position: absolute;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
      }

      .contador1 {
        left: 2360px;
        top: 75px;
        width: 900px;
        height: 400px;
      }

      .contador2 {
        left: 2800px;
        top: 850px;
        width: 900px;
        height: 400px;
      }

      .contador3 {
        left: 510px;
        top: 845px;
        width: 900px;
        height: 400px;
      }

      /* 🔤 TODAS LAS FRASES */
      .texto {
        font-family: "Dela Gothic One", sans-serif;
        font-weight: 400;
        font-size: 150px;
        color: #ffffff;
        line-height: 1;
        text-align: center;
      }
    </style>
  </head>

  <body>
    <div class="stage">
      <video class="video-bg" autoplay muted loop>
        <source src="fondo.mp4" type="video/mp4" />
      </video>

      <!-- 🔁 MISMA FRASE EN LAS 3 ZONAS -->
      <div class="contador contador1">
        <div class="texto" id="frase1"></div>
      </div>

      <div class="contador contador2">
        <div class="texto" id="frase2"></div>
      </div>

      <div class="contador contador3">
        <div class="texto" id="frase3"></div>
      </div>

      <script>
        function escalarStage() {
          const stage = document.querySelector(".stage");

          const scaleX = window.innerWidth / 4147;
          const scaleY = window.innerHeight / 1556;

          const scale = Math.min(scaleX, scaleY);

          stage.style.transform = `scale(${scale})`;
        }

        window.addEventListener("resize", escalarStage);
        window.addEventListener("load", escalarStage);

        // ✅ NUEVAS FRASES
        const frases = [
          "Aún estás a tiempo de empezar de nuevo.",
          "Perdonar también te libera.",
          "Agradecer cambia el día.",
          "Alguien necesita tu ayuda hoy.",
          "Una palabra amable cambia el día.",
          "Hoy puedes elegir la calma.",
          "Lo simple también transforma.",
          "Ayudar también te cambia.",
          "Un momento de silencio ayuda."
        ];

        function cambiarFrase() {
          const randomIndex = Math.floor(Math.random() * frases.length);
          const frase = frases[randomIndex];

          document.getElementById("frase1").textContent = frase;
          document.getElementById("frase2").textContent = frase;
          document.getElementById("frase3").textContent = frase;
        }

        cambiarFrase();
        setInterval(cambiarFrase, 5000);
      </script>
    </div>
  </body>
</html>
