<!doctype html>
<html lang="es">
  <head>
    <title>Dia de la madre</title>

    <!-- ✅ Fuente correcta -->
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@1,800&display=swap" rel="stylesheet">

    <style>
      .stage {
        position: relative;
        width: 4147px;
        height: 1556px;
        transform-origin: top left;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: black;
      }

      .video-bg {
        position: absolute;
        top: 0;
        left: 0;
        width: 4147px;
        height: 1556px;
        object-fit: cover;
        z-index: 0;
      }

      .contador {
        position: absolute;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
      }

      .contador1 {
        left: 2360px;
        top: 75px;
        width: 900px;
        height: 400px;
      }

      .contador2 {
        left: 2800px;
        top: 850px;
        width: 900px;
        height: 400px;
      }

      .contador3 {
        left: 510px;
        top: 845px;
        width: 900px;
        height: 400px;
      }

      /* 🔤 TODAS LAS FRASES */
      .texto {
        font-family: "Open Sans", sans-serif;
        font-weight: 400;
        font-size: 90px;
        color: #F3574A;
        line-height: 1;
        text-align: center;
      }
    </style>
  </head>

  <body>
    <div class="stage">
      <video class="video-bg" autoplay muted loop>
        <source src="fondo.mp4" type="video/mp4" />
      </video>

      <!-- 🔁 MISMA FRASE EN LAS 3 ZONAS -->
     
      <div class="contador contador2">
        <div class="texto" id="frase2"></div>
      </div>

      <div class="contador contador3">
        <div class="texto" id="frase3"></div>
      </div>

      <script>
        function escalarStage() {
          const stage = document.querySelector(".stage");

          const scaleX = window.innerWidth / 4147;
          const scaleY = window.innerHeight / 1556;

          const scale = Math.min(scaleX, scaleY);

          stage.style.transform = `scale(${scale})`;
        }

        window.addEventListener("resize", escalarStage);
        window.addEventListener("load", escalarStage);

        // ✅ NUEVAS FRASES
        const frases = [
          "Usted no se manda solo.",
"Mientras viva bajo este techo, se hace lo que yo diga",
"No me abra los ojos que no le voy a echar gotas",
"Si sus amigos se tiran de un puente, ¿usted también?",
"Le entra por un oído y le sale por el otro",
"Cuento hasta 3...",
"¡Búsqueme que me va a encontrar!",
"Algún día me lo va a agradecer.",
"Cuando tengas hijos, te vas a acordar de mí."
        ];

        function cambiarFrase() {
          const randomIndex = Math.floor(Math.random() * frases.length);
          const frase = frases[randomIndex];

          document.getElementById("frase2").textContent = frase;
          document.getElementById("frase3").textContent = frase;
        }

        cambiarFrase();
        setInterval(cambiarFrase, 5000);
      </script>
    </div>
  </body>
</html>
